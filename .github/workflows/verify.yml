name: verify

on:
  pull_request:
  push:
    branches: [main]

# The route manifest is a contract. CI's job is to prove the build still
# satisfies it — never to update it.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # `npm run verify` composes every check below and is the documented source
      # of truth, so CI can no longer be stronger than what an agent runs
      # locally — it used to be, which meant a local green could still be a red
      # push. These steps are kept separate for readable CI output, and
      # scripts/selftest.mjs asserts that every `npm run` command in this file
      # is one that `npm run verify` also runs.

      # Proves the verify suite itself still fails on broken builds. Runs first:
      # a green suite that cannot go red is worth nothing.
      - name: verify harness selftest
        run: npm run verify:selftest

      - name: content schemas
        run: npm run verify:schemas

      # Builds, then checks the frozen contract, routes, cards, content, links
      # and the ledger against it. Exit code is the source of truth.
      - name: verify
        run: npm run verify

      - name: ledger format and append-only history
        run: npm run ledger:check
