name: schedule

# THE CLOCK, AND NOTHING ELSE.
#
# `publishAfter` on a record defers it until a date. Nothing else on this site
# builds itself — `deploy` fires when `verify` concludes on `main`, and `verify`
# fires on a push — so without a clock a dated page waits for whatever push
# happens to come next. That is not a schedule, it is a coincidence.
#
# WHY A THIRD WORKFLOW INSTEAD OF A CRON ON `verify`.
#
# `deploy` triggers on `verify` CONCLUDING SUCCESSFULLY. Put the cron on
# `verify` and every day produces a successful run, so every day produces a
# deployment — the same site, republished, burying real releases in a list of
# identical ones. Gating it with a job whose `if` skips the verify job does not
# help: a run whose jobs are skipped still concludes `success`, and `deploy`
# would fire on it just the same.
#
# So the decision is made BEFORE any of that. This workflow asks one question
# each morning and, on the usual answer, stops. Nothing is built, nothing is
# deployed, and no run appears anywhere else. `verify.yml` and `deploy.yml` are
# untouched by this feature and keep meaning exactly what they meant.

on:
  schedule:
    # 06:00 UTC. GitHub's cron is best-effort and lags under load — at midnight
    # it lags most, because everyone writes midnight. An hour of drift on a date
    # that was chosen in days does not matter; a run that never gets a slot does.
    - cron: '0 6 * * *'
  # For testing this workflow, and for the morning someone wants the answer now.
  workflow_dispatch:
    inputs:
      force:
        # THE DISPATCH STEP IS OTHERWISE UNTESTABLE UNTIL THE DAY IT MATTERS.
        #
        # Whether this token may start a workflow run is the one thing here that
        # cannot be checked by reading it, and the honest occasions to find out
        # are precisely the occasions where being wrong is expensive: a date
        # arrives, nothing happens. This makes the question askable on an
        # ordinary Tuesday. Forcing it starts `verify` on `main`, which
        # redeploys the site unchanged — one spare deployment, and an answer.
        description: 'Start verify even with nothing due — tests the dispatch path'
        type: boolean
        default: false

permissions:
  contents: read
  # To start `verify`. This is the only workflow here that holds it.
  actions: write

jobs:
  due:
    runs-on: ubuntu-latest
    # The `secrets` context is NOT readable from a step-level `if:`. Testing it
    # there parses cleanly and is silently always-false, which on this workflow
    # would mean the alarm below can never ring — the same class of green-and-
    # wrong the alarm exists to catch. Lifted to `env`, which `if:` can read.
    env:
      SCHEDULE_TOKEN: ${{ secrets.SCHEDULE_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No `npm ci`. The guard reads records and makes HEAD requests; it has no
      # dependencies, which is what keeps the daily cost near zero on the ~364
      # days it answers "no".
      - id: due
        name: is anything due
        run: node scripts/publish-due.mjs

      # ── GITHUB_TOKEN IS NOT ENOUGH, AND IT FAILS IN THE WORST WAY ────────────
      #
      # Measured on 2026-08-11, not assumed. Forcing this workflow with
      # GITHUB_TOKEN DID start verify (run 31469082557, workflow_dispatch,
      # success) and NO deploy followed it. GitHub's recursion guard is the
      # cause: a run created by GITHUB_TOKEN does not itself trigger further
      # workflows, and `deploy` triggers on `workflow_run` of verify.
      #
      # So the naive version of this feature is worse than a broken one. It goes
      # green: the schedule runs, verify runs, verify passes, every check is a
      # tick — and the page is not published, with nothing anywhere saying so.
      # That is the precise shape of failure the guard, the symmetry and the
      # fail-open were all written against, arriving through the back door.
      #
      # The fix is a token whose runs are attributed to a person: a fine-grained
      # PAT or a GitHub App installation token with `actions: write` on this
      # repo, in the SCHEDULE_TOKEN secret.
      #
      # The alarm is wired to "a record carries a date", not to "a date is due".
      # Wired to the latter it would first ring on the morning of the miss,
      # which is the one morning it is no use.
      - name: a dated record needs a token that can publish
        if: steps.due.outputs.dated != '0' && env.SCHEDULE_TOKEN == ''
        run: |
          echo "::error::A record carries publishAfter but SCHEDULE_TOKEN is not set. GITHUB_TOKEN can start verify and deploy will NOT follow it, so the date would pass with every check green and the page still unpublished. Add a fine-grained PAT with actions:write as SCHEDULE_TOKEN."
          exit 1

      # `verify` then runs as it always does and `deploy` follows it, so the
      # scheduled path publishes through exactly the same gate as a push. There
      # is still no second definition of what may ship.
      - name: start verify
        if: steps.due.outputs.proceed == 'true' || inputs.force
        env:
          GH_TOKEN: ${{ secrets.SCHEDULE_TOKEN }}
        run: |
          echo "due: ${{ steps.due.outputs.reason }}"
          gh workflow run verify.yml --ref main
          echo "verify dispatched — deploy follows it on success"
